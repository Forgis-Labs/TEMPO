# TEMPO 2-Phase Pipeline — FSQ-Transformer + Qwen3-4B
#
# Phase 0: Embedding alignment (200K samples, TS embeddings only, lr=1e-3)
# Phase 1: Multi-task training (267K samples, DoRA + embeddings, lr=2e-5)
#
# This is the "big" training: pre-built parquet datasets, not curriculum.
#
# Pre-requisites:
#   1. Phase 0 data on S3: s3://{bucket}/tempo/phase0_fsqt_v6/
#   2. Phase 1 data on S3: s3://{bucket}/tempo/phase1/
#   3. Qwen3-4B on S3:    s3://{bucket}/tempo/llm/Qwen3-4B/
#   4. Tokenizer on S3:   s3://{bucket}/tempo/tokenizer/
#
# Launch:
#   uv run python launch_sagemaker.py \
#     --config configs/pipeline_4B.yaml --spot

# -- SageMaker / Infra --
sagemaker:
  bucket: ""  # set via SAGEMAKER_BUCKET env var or --bucket CLI flag
  region: us-east-2
  role: ""    # set via SAGEMAKER_ROLE_ARN env var or --role CLI flag
  instance: ml.p5.48xlarge    # 8x H100 80GB
  spot: true
  s3_prefix: tempo
  job_name: tempo-pipeline-4B

# -- Model --
model:
  llm_id: Qwen/Qwen3-4B
  tokenizer: fsq_transformer
  fsq_ckpt: fsq_transformer_625_best.pt
  lora_r: 32
  lora_alpha: 64
  use_dora: true

# -- Training --
training:
  # 4B needs smaller batch than 1.7B
  # Effective batch: 4 x 8 x 4 = 128
  batch_size: 4
  grad_accum: 4
  num_workers: 4

  # Phase 0: Embedding alignment
  phase0_epochs: 5
  phase0_lr: 1.0e-3
  phase0_patience: 5

  # Phase 1: Full training
  phase1_epochs: 3
  phase1_lr: 2.0e-5
  phase1_patience: 2
  warmup_frac: 0.10

  # Packing
  use_packing: true
  pack_length: 1024

# -- Data paths (S3) --
data:
  phase0_s3_path: tempo/phase0_fsqt_v6/
  phase1_s3_path: tempo/phase1/

# -- Phase selection --
phases:
  skip_phase0: false
  phase0_only: false

# -- Environment --
environment:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  NCCL_DEBUG: WARN
  TOKENIZERS_PARALLELISM: "false"
  GRAD_CHECKPOINT: "true"
  SHRIKE_TRAINER: "v2"
