[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo"
version = "0.2.0"
description = "Time Series Understanding via Discrete Tokenization"
license = {text = "CC-BY-NC-SA-4.0"}
requires-python = ">=3.10"
authors = [
    {name = "Forgis Labs"},
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.30",
    "datasets",
    "pyarrow",
    "numpy<2",
    "scipy",
    "scikit-learn",
    "tqdm",
    "aeon>=1.3.0",
    "wfdb>=4.3.1",
    "yfinance>=1.3.0",
    "sagemaker>=2.200,<3",
    "botocore[crt]>=1.42.97",
    "h5py>=3.16.0",
    "einops>=0.8.2",
    "gradio>=6.14.0",
    "openai>=2.33.0",
    "umap-learn>=0.5.12",
    "tiktoken>=0.12.0",
    "ijson>=3.5.0",
]

[project.optional-dependencies]
eval = ["statsmodels"]
aws = ["boto3", "sagemaker"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tempo*", "tokenizer_study*"]
